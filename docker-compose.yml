services:
  api:
    image: api-image
    ports:
      - "9090:9090" # HTTP server port for Connect
    environment:
      # Set timezone to match host system for Firebase token compatibility
      TZ: "America/New_York"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HTTP_SERVER_PORT: ${HTTP_SERVER_PORT:-9090}
      GRPC_SERVER_PORT: ${GRPC_SERVER_PORT}
      TOKEN_SYMMETRIC_KEY: ${TOKEN_SYMMETRIC_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-api-key-12345}
      ENVIRONMENT: ${ENVIRONMENT}
      SENDINBLUE_API_KEY: ${SENDINBLUE_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      # Firebase configuration
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST}
      FIREBASE_STORAGE_EMULATOR_HOST: ${FIREBASE_STORAGE_EMULATOR_HOST}
      FIREBASE_STORAGE_EMULATOR_EXTERNAL_HOST: ${FIREBASE_STORAGE_EMULATOR_EXTERNAL_HOST}
      # Google Cloud Storage emulator host for Admin SDK compatibility
      STORAGE_EMULATOR_HOST: ${FIREBASE_STORAGE_EMULATOR_HOST}
      # Pub/Sub configuration
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID}
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST}
      PUBSUB_TOPIC_PREFIX: ${PUBSUB_TOPIC_PREFIX}
      # Storage configuration (bucket name for Firebase)
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      # PASETO configuration for BFF → API authentication
      PASETO_SECRET_KEY: ${PASETO_SECRET_KEY}
      PASETO_ISSUER: ${PASETO_ISSUER:-thread-art-generator}
      PASETO_TTL_MINUTES: ${PASETO_TTL_MINUTES:-15}
    volumes:
      # Mount timezone data for proper timezone handling
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - db

  # Worker service for processing compositions
  worker:
    image: worker-image
    environment:
      # Set timezone to match host system for Firebase token compatibility
      TZ: "America/New_York"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT}
      # Firebase configuration
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_STORAGE_EMULATOR_HOST: ${FIREBASE_STORAGE_EMULATOR_HOST}
      FIREBASE_STORAGE_EMULATOR_EXTERNAL_HOST: ${FIREBASE_STORAGE_EMULATOR_EXTERNAL_HOST}
      # Google Cloud Storage emulator host for Admin SDK compatibility
      STORAGE_EMULATOR_HOST: ${FIREBASE_STORAGE_EMULATOR_HOST}
      # Pub/Sub configuration
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID}
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST}
      PUBSUB_TOPIC_PREFIX: ${PUBSUB_TOPIC_PREFIX}
      # Storage configuration (bucket name for Firebase)
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    depends_on:
      - db
      - api
    restart: unless-stopped

  # Go+HTMX Frontend service
  client:
    image: frontend-image
    ports:
      - "8080:8080"
    environment:
      # Set timezone to match host system for Firebase token compatibility
      - TZ=America/New_York
      - FRONTEND_PORT=8080
      - API_URL=${API_URL:-http://api:9090}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_ADDR=redis:6379
      - COOKIE_HASH_KEY=${COOKIE_HASH_KEY:-ADefaultHashKeyFor32BytesSecureHashing}
      - COOKIE_BLOCK_KEY=${COOKIE_BLOCK_KEY:-ADefaultBlockKeyShould32BytesLength}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - FIREBASE_AUTH_EMULATOR_HOST=${FIREBASE_AUTH_EMULATOR_HOST}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      # PASETO configuration for BFF → API authentication
      - PASETO_SECRET_KEY=${PASETO_SECRET_KEY}
      - PASETO_ISSUER=${PASETO_ISSUER:-thread-art-generator}
      - PASETO_TTL_MINUTES=${PASETO_TTL_MINUTES:-15}
    volumes:
      # Mount timezone data for proper timezone handling
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./client/internal:/app/client/internal
      - ./client/public:/app/client/public
      - ./client/cmd:/app/client/cmd
      - ./build/frontend:/app/frontend
    depends_on:
      - api
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis for session storage
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./Infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - threadmachine:/var/lib/postgresql/data
    container_name: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  threadmachine:
  redis_data:

networks:
  default:
    name: thread-art-network
