services:
  api:
    image: api-image
    ports:
      - "9090:9090"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HTTP_SERVER_PORT: ${HTTP_SERVER_PORT:-9090}
      GRPC_SERVER_PORT: ${GRPC_SERVER_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
      SENDINBLUE_API_KEY: ${SENDINBLUE_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: thread-art
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PUBLIC_BASE_URL: http://localhost:9000/thread-art
      S3_FORCE_PATH_STYLE: "true"
      S3_USE_TLS: "false"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - db
      - minio
      - minio-init

  worker:
    image: worker-image
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT}
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: thread-art
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PUBLIC_BASE_URL: http://localhost:9000/thread-art
      S3_FORCE_PATH_STYLE: "true"
      S3_USE_TLS: "false"
    depends_on:
      - db
      - api
      - minio
      - minio-init
    restart: unless-stopped

  client:
    image: frontend-image
    ports:
      - "8080:8080"
    environment:
      - FRONTEND_PORT=8080
      - API_URL=${API_URL:-http://api:9090}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_ADDR=redis:6379
      - COOKIE_HASH_KEY=${COOKIE_HASH_KEY:-ADefaultHashKeyFor32BytesSecureHashing}
      - COOKIE_BLOCK_KEY=${COOKIE_BLOCK_KEY:-ADefaultBlockKeyShould32BytesLength}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
    volumes:
      - ./client/internal:/app/client/internal
      - ./client/public:/app/client/public
      - ./client/cmd:/app/client/cmd
      - ./build/frontend:/app/frontend
    depends_on:
      - api
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./Infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - threadmachine:/var/lib/postgresql/data
    container_name: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./Infra/minio/cors.xml:/cors.xml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          i=$$((i+1))
          if [ $$i -gt 30 ]; then echo "minio never became ready"; exit 1; fi
          sleep 1
        done
        mc mb --ignore-existing local/thread-art
        mc anonymous set download local/thread-art
        mc cors set local/thread-art /cors.xml || true

volumes:
  threadmachine:
  redis_data:
  minio_data:

networks:
  default:
    name: thread-art-network
