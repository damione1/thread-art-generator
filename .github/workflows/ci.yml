name: ci

on:
  push:
    branches: [feature/rebuild, master]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint proto
      - name: buf breaking
        # This PR is the contract cutover (dropped Firebase/upload RPCs vs current master).
        # Skip FILE breaking here and on the merge push; later PRs into master are gated.
        if: |
          !(github.event_name == 'pull_request' && github.base_ref == 'master' && github.head_ref == 'feature/rebuild')
          && !(github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            AGAINST=".git#ref=origin/${GITHUB_BASE_REF},subdir=proto"
          else
            AGAINST=".git#ref=HEAD~1,subdir=proto"
          fi
          buf breaking proto --against "$AGAINST"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: make test
